# Kubernetes versions
# (e.g. 1.33.0 - has to match versions in https://github.com/yannh/kubernetes-json-schema)
k8s_versions:
  - 1.33.0

# use strict validation (reject unknown fields in resources)
strict: true

# types to be skipped (e.g. certmanager.k8s.io/v1, or certmanager.k8s.io/v1/Certificate)
skip_types:
  - source.toolkit.fluxcd.io/v1/HelmRepository
  - traefik.io/v1alpha1/IngressRoute
  - traefik.io/v1alpha1/Middleware

# load additional CRDs (URLs of CRD yaml files)
additional_crds:
  - https://raw.githubusercontent.com/cert-manager/cert-manager/master/deploy/crds/cert-manager.io_clusterissuers.yaml
  # Full-schema CRDs for the operator version in victoria-metrics-operator 0.68.1
  - https://raw.githubusercontent.com/VictoriaMetrics/operator/v0.75.0/config/crd/overlay/crd.yaml
  # Elasticsearch CRD for the operator version in eck-operator 3.5.0. The combined
  # crds.yaml bundle can't be used as its descriptions contain ${VAR} examples.
  - https://raw.githubusercontent.com/elastic/cloud-on-k8s/v3.5.0/config/crds/v1/resources/elasticsearch.k8s.elastic.co_elasticsearches.yaml
  - https://raw.githubusercontent.com/elastic/cloud-on-k8s/v3.5.0/config/crds/v1/resources/kibana.k8s.elastic.co_kibanas.yaml

# set values for substitution variables (e.g. ${releaseNamespace}) in the resources
substitution_vars:
  releaseNamespace: kommander
  workspaceNamespace: workspace
