overview: |-
  ## Overview
  Open WebUI is an extensible, self-hosted web interface for interacting with large language models. It supports Ollama and OpenAI-compatible APIs, and adds features such as chat history, document upload (RAG), tools and multi-user access.

  This application uses the upstream chart defaults, which deploy:

  * Open WebUI itself, with a 2Gi persistent volume from the default StorageClass for its data
  * [Ollama](https://ollama.com/) for running models in-cluster (CPU only, no models pulled by default)
  * [Pipelines](https://github.com/open-webui/pipelines) for extending Open WebUI
  * A small Redis instance for websocket support

  The Open WebUI service is exposed as a `LoadBalancer` on port 80. Find its external IP with the following:

  ```
  kubectl -n <WORKSPACE NAMESPACE> get svc open-webui
  ```

  ## Initial admin account
  There is no default username or password. The **first account created** through the web UI's sign-up page becomes the administrator, so create it as soon as the service is reachable.

  ## Models
  To pull a model into the bundled Ollama when the application starts, set:

  ```
  ollama:
    ollama:
      models:
        pull:
          - llama3.2
  ```

  To use an existing Ollama server instead of the bundled one, set:

  ```
  ollama:
    enabled: false
  ollamaUrls:
    - http://<OLLAMA HOST>:11434
  ```

  Source code and documentation can be found here:

  * <https://docs.openwebui.com/>
  * <https://github.com/open-webui/open-webui>
  * <https://github.com/open-webui/helm-charts>
