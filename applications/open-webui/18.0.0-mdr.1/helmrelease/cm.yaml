---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${releaseName}-config-defaults
  namespace: ${releaseNamespace}
data:
  values.yaml: |
    ---
    # Expose via the NKP Traefik ingress, which terminates TLS
    ingress:
      enabled: true
      class: kommander-traefik
      annotations:
        traefik.ingress.kubernetes.io/router.tls: "true"
      # Needs customizing
      host: chat.example.com
