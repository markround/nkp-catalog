overview: |-
  ## Overview
  Deploys a single-node VictoriaMetrics time series database into the workspace namespace, using a `VMSingle` custom resource managed by the VictoriaMetrics Operator.

  VictoriaMetrics is a fast, cost-effective and scalable time series database and monitoring solution. It accepts data via Prometheus remote write and other common ingestion protocols, and can be queried with PromQL or MetricsQL.

  The instance is called `victoria-metrics`. It keeps 1 month of data on a 10Gi persistent volume from the default StorageClass, and is reachable inside the cluster at `vmsingle-victoria-metrics.<workspace-namespace>.svc:8428/mdr/vmsingle` (the UI is at `/mdr/vmsingle/vmui/`).

  This application requires the VictoriaMetrics Operator application to be enabled in the same workspace.

  Source code and documentation can be found here:

  * <https://docs.victoriametrics.com/victoriametrics/single-server-victoriametrics/>
  * <https://docs.victoriametrics.com/operator/resources/vmsingle/>
  * <https://github.com/VictoriaMetrics/VictoriaMetrics>
