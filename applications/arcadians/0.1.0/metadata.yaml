overview: |
  # Arcadians
  
  The Arcadians demo by James Tate, ported to NKP. Used as part of a demonstration of backing up and migrating a stateful app on Kubernetes. Also a very fun game in it's own right!

  Arcadians was released by Acornsoft in 1982 for the BBC Micro — itself a clone of Namco's Galaxian, which was itself a response to Space Invaders. It's a game about aliens that hold formation, sweep side to side, then peel off in curved dive-bombing runs while shooting at you. Simple, brutal, compelling.

  This project rebuilds it faithfully in HTML5 Canvas and Web Audio, wraps it in a FastAPI + PostgreSQL backend for persistent high scores, and deploys the whole thing on NKP as a Kubernetes demo stack.

  - Original blog post: https://blog.kodu.uk/arcadians-clone-classic-bbc-micro-game/
  - Original code: https://github.com/jdtate101/Arcadians
  - My fork: https://github.com/markround/Arcadians

  **Note:** For demo purposes, this application will always be deployed to the `retro-game` namespace.
