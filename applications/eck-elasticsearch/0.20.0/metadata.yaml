overview: |-
  ## Overview
  Deploys an Elasticsearch cluster into the workspace namespace using Elastic's `eck-elasticsearch` Helm chart, which creates an `Elasticsearch` custom resource managed by the ECK Operator. Unlike the static Elasticsearch application, the cluster can be customised through Helm values.

  The defaults deploy a single-node Elasticsearch 9.5.6 cluster for demo purposes, called `eck-elasticsearch`. It has a 10Gi persistent volume from the default StorageClass, and is reachable inside the cluster over HTTPS at `https://eck-elasticsearch-es-http.<WORKSPACE NAMESPACE>.svc:9200`. The node needs at least 2GiB of free memory on a worker node to schedule.

  `node.store.allow_mmap` is disabled so that `vm.max_map_count` does not need changing on the nodes. This has performance implications and is not suitable for production workloads.

  This application requires the ECK Operator application to be enabled in the same workspace.

  ## Customising
  The `nodeSets` value is passed through as-is to the `Elasticsearch` resource, so it accepts any [ECK nodeSet](https://www.elastic.co/docs/deploy-manage/deploy/cloud-on-k8s/node-configuration) settings: node count, roles, config, `podTemplate` (resources, scheduling etc.) and `volumeClaimTemplates`.

  Helm replaces lists rather than merging them, so an override must supply the **complete** `nodeSets` list. For example, to change the volume size to 50Gi and use a specific StorageClass:

  ```
  nodeSets:
  - name: default
    count: 1
    config:
      node.store.allow_mmap: false
    volumeClaimTemplates:
    - metadata:
        name: elasticsearch-data
      spec:
        accessModes:
        - ReadWriteOnce
        storageClassName: <STORAGE CLASS>
        resources:
          requests:
            storage: 50Gi
  ```

  The volume claim template must be named `elasticsearch-data`. The size of an existing volume can only be increased, and only if its StorageClass allows volume expansion.

  ## Credentials
  ECK generates a password for the built-in `elastic` superuser. Retrieve it with the following:

  ```
  kubectl -n <WORKSPACE NAMESPACE> get secret eck-elasticsearch-es-elastic-user -o go-template='{{.data.elastic | base64decode}}'
  ```

  ## Connecting
  The HTTP endpoint uses a self-signed certificate generated by ECK. To test connectivity from your workstation:

  ```
  kubectl -n <WORKSPACE NAMESPACE> port-forward svc/eck-elasticsearch-es-http 9200:9200
  curl -k -u "elastic:<PASSWORD>" https://localhost:9200
  ```

  Source code and documentation can be found here:

  * <https://www.elastic.co/docs/deploy-manage/deploy/cloud-on-k8s/managing-deployments-using-helm-chart>
  * <https://github.com/elastic/cloud-on-k8s/tree/main/deploy/eck-stack/charts/eck-elasticsearch>
