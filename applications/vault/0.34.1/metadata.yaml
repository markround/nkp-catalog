overview: |-
  ## Overview
  HashiCorp Vault secures, stores and tightly controls access to tokens, passwords, certificates, encryption keys and other secrets.

  This application deploys a single, non-HA Vault server for demo purposes:

  * One Vault pod (`vault-0`) using file storage on a 10Gi persistent volume from the default StorageClass
  * The UI and API exposed via an Ingress on the NKP Traefik ingress controller, which terminates TLS
  * The Vault Agent Injector, so pods can have secrets injected using annotations

  Inside the cluster, Vault is reachable over plain HTTP at `http://vault.<WORKSPACE NAMESPACE>.svc:8200`.

  ## Required values
  ### Hostname

  Vault cannot be served under a sub-path, so it needs its own FQDN that resolves in DNS (or local hosts files etc.) to the external IP of the NKP Traefik ingress controller. Find that IP with:

  ```
  kubectl get svc -A | grep kommander-traefik
  ```

  You **must** set the following value specific to your environment:

  ```
  server:
    ingress:
      hosts:
        - host: <YOUR HOSTNAME>
          paths: []
  ```

  The default is `vault.example.com`. Once deployed, browse to `https://<YOUR HOSTNAME>`.

  ## Post-install: initialise and unseal
  Vault starts **uninitialised and sealed**, and the `vault-0` pod will show as not ready (`0/1`) until it is unsealed. After installing, initialise it with a single unseal key:

  ```
  kubectl -n <WORKSPACE NAMESPACE> exec vault-0 -- vault operator init -key-shares=1 -key-threshold=1
  ```

  This prints `Unseal Key 1` and the `Initial Root Token`. **Save both** – they are not stored anywhere and cannot be recovered. Then unseal Vault with:

  ```
  kubectl -n <WORKSPACE NAMESPACE> exec vault-0 -- vault operator unseal <UNSEAL KEY>
  ```

  Log in to the UI or CLI with the root token. Alternatively, both steps can be carried out in the web UI.

  **Vault seals itself whenever the pod restarts** (including upgrades and node maintenance), so the unseal command above must be run again after every restart.

  Source code and documentation can be found here:

  * <https://developer.hashicorp.com/vault/docs>
  * <https://developer.hashicorp.com/vault/docs/platform/k8s/helm>
  * <https://github.com/hashicorp/vault-helm>
