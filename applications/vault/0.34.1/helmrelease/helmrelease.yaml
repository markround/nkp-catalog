apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ${releaseName}-repository
  namespace: ${releaseNamespace}
spec:
  interval: 6h0m0s
  url: https://helm.releases.hashicorp.com
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault
  namespace: ${releaseNamespace}
spec:
  chart:
    spec:
      chart: vault
      sourceRef:
        kind: HelmRepository
        name: ${releaseName}-repository
        namespace: ${releaseNamespace}
      version: 0.34.1
  install:
    createNamespace: true
    # The Vault pod is not Ready until it has been manually initialised and
    # unsealed, so don't wait for it or the install will time out and retry
    disableWait: true
    remediation:
      retries: 30
  interval: 15s
  releaseName: vault
  targetNamespace: ${releaseNamespace}
  upgrade:
    # A restarted pod comes back sealed, see above
    disableWait: true
    remediation:
      retries: 30
  valuesFrom:
  - kind: ConfigMap
    name: ${releaseName}-config-defaults
---
