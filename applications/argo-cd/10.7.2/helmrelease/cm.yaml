---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${releaseName}-config-defaults
  namespace: ${releaseNamespace}
data:
  values.yaml: |
    ---
    global:
      # Most override this
      domain: localhost
      
    configs:
      params:
        # So we can use Traefik TLS termination
        server.insecure: true
        # For ingress on a subpath
        server.rootpath: /argo-cd
        server.basehref: /argo-cd 
      # So applications have a health check and can therefore be included in sync waves
      # See https://argo-cd.readthedocs.io/en/stable/operator-manual/health/
      cm:
        resource.customizations.health.argoproj.io_Application: |
          hs = {}
          hs.status = "Progressing"
          hs.message = ""
          if obj.status ~= nil then
            if obj.status.health ~= nil then
              hs.status = obj.status.health.status
              if obj.status.health.message ~= nil then
                hs.message = obj.status.health.message
              end
            end
          end
          return hs
        statusbadge.enabled: true  

    server:
      metrics:
        enabled: true
      ingress:
        enabled: true
        ingressClassName: kommander-traefik
        annotations:
          traefik.ingress.kubernetes.io/router.tls: "true"
        path: /argo-cd

    # Metrics support
    controller:
      metrics:
        enabled: true
    applicationSet:
      metrics:
        enabled: true 
    dex:
      metrics:
        enabled: true
    redis:
      metrics:
        enabled: true
    repoServer:
      metrics:
        enabled: true
    notifications:
      metrics:
        enabled: true
