overview: |-
  ## Overview
  Valkey is an open source, high-performance in-memory key/value datastore. It is a fork of Redis and is compatible with Redis clients and tooling.

  This application deploys a single, non-HA Valkey instance for demo purposes:

  * One Valkey pod (no replicas), with data persisted to an 8Gi volume from the default StorageClass
  * Exposed inside the cluster only, via a `ClusterIP` service at `valkey.<WORKSPACE NAMESPACE>.svc.cluster.local:6379`
  * ACL authentication enabled for the `default` user

  ## Default username and password
  The default username is `default` and the default password is `changeme`. **You should override this** by setting the following value:

  ```
  auth:
    aclUsers:
      default:
        permissions: "~* &* +@all"
        password: <YOUR PASSWORD>
  ```

  Retrieve the current password with the following:

  ```
  kubectl -n <WORKSPACE NAMESPACE> get secret valkey-auth -o go-template='{{index .data "default-password" | base64decode}}'
  ```

  ## Connecting
  To test connectivity from your workstation, port-forward the service and connect with `valkey-cli` (or `redis-cli`):

  ```
  kubectl -n <WORKSPACE NAMESPACE> port-forward svc/valkey 6379:6379
  valkey-cli -h 127.0.0.1 -p 6379 --user default --pass <PASSWORD> ping
  ```

  Source code and documentation can be found here:

  * <https://valkey.io/>
  * <https://github.com/valkey-io/valkey-helm>
