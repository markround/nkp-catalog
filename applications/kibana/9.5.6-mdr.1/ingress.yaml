---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: kommander-traefik
    traefik.ingress.kubernetes.io/router.tls: "true"
  name: mdr-kibana
  namespace: ${workspaceNamespace}
spec:
  rules:
  - http:
      paths:
      - backend:
          service:
            name: kibana-kb-http
            port:
              number: 5601
        path: /mdr/kibana
        pathType: ImplementationSpecific
