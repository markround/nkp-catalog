overview: |-
  ## Overview
  Deploys a single Kibana 9.5.6 instance into the workspace namespace for demo purposes, using a `Kibana` custom resource managed by the ECK Operator. It connects automatically to the `elasticsearch` cluster deployed by the Elasticsearch application.

  The instance is called `kibana` and is reachable inside the cluster over plain HTTP at `http://kibana-kb-http.<WORKSPACE NAMESPACE>.svc:5601/mdr/kibana`. TLS is disabled and everything is served under the `/mdr/kibana` path prefix, so that it can sit behind a path-based Ingress which terminates TLS.

  This application requires the ECK Operator and Elasticsearch applications to be enabled in the same workspace.

  ## Credentials
  Log in as the built-in `elastic` superuser created by the Elasticsearch application. Retrieve its password with the following:

  ```
  kubectl -n <WORKSPACE NAMESPACE> get secret elasticsearch-es-elastic-user -o go-template='{{.data.elastic | base64decode}}'
  ```

  ## Connecting
  To access Kibana from your workstation without an Ingress, port-forward the service and browse to <http://localhost:5601/mdr/kibana>:

  ```
  kubectl -n <WORKSPACE NAMESPACE> port-forward svc/kibana-kb-http 5601:5601
  ```

  Source code and documentation can be found here:

  * <https://www.elastic.co/docs/deploy-manage/deploy/cloud-on-k8s/kibana-instance-quickstart>
  * <https://github.com/elastic/cloud-on-k8s>
