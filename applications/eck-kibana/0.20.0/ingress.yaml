---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
  name: mdr-eck-kibana
  namespace: ${workspaceNamespace}
spec:
  ingressClassName: kommander-traefik
  rules:
  - http:
      paths:
      - backend:
          service:
            name: eck-kibana-kb-http
            port:
              number: 5601
        # Must match server.basePath in the Helm values
        path: /mdr/kibana
        pathType: ImplementationSpecific
