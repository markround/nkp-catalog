overview: |-
  ## Overview
  Deploys Kibana into the workspace namespace using Elastic's `eck-kibana` Helm chart, which creates a `Kibana` custom resource managed by the ECK Operator. It connects automatically to the `eck-elasticsearch` cluster deployed by the ECK Elasticsearch application.

  The defaults deploy a single Kibana 9.5.6 instance for demo purposes, called `eck-kibana`. It is served over plain HTTP under the `/mdr/kibana` path prefix, and exposed through the NKP Traefik ingress (which terminates TLS) at `https://<NKP HOSTNAME>/mdr/kibana/`. A link is also added to the NKP dashboard.

  Inside the cluster it is reachable at `http://eck-kibana-kb-http.<WORKSPACE NAMESPACE>.svc:5601/mdr/kibana`.

  This application requires the ECK Operator and ECK Elasticsearch applications to be enabled in the same workspace.
  ## Customising
  Most fields of the [Kibana resource](https://www.elastic.co/docs/deploy-manage/deploy/cloud-on-k8s/kibana-configuration) can be set through Helm values, including `count`, `config`, `podTemplate` and `http`. The Kibana `version` must not be newer than the Elasticsearch version.

  The ingress included in this application routes `/mdr/kibana` to Kibana, so do not change `config.server.basePath` unless you also provide your own ingress.

  ## Credentials
  Log in as the built-in `elastic` superuser created by the ECK Elasticsearch application. Retrieve its password with the following:

  ```
  kubectl -n <WORKSPACE NAMESPACE> get secret eck-elasticsearch-es-elastic-user -o go-template='{{.data.elastic | base64decode}}'
  ```

  ## Connecting
  To access Kibana from your workstation without the ingress, port-forward the service and browse to <http://localhost:5601/mdr/kibana>:

  ```
  kubectl -n <WORKSPACE NAMESPACE> port-forward svc/eck-kibana-kb-http 5601:5601
  ```

  Source code and documentation can be found here:

  * <https://www.elastic.co/docs/deploy-manage/deploy/cloud-on-k8s/managing-deployments-using-helm-chart>
  * <https://github.com/elastic/cloud-on-k8s/tree/main/deploy/eck-stack/charts/eck-kibana>
dependencies:
- eck-operator
- eck-elasticsearch
