apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ${releaseName}-repository
  namespace: ${releaseNamespace}
spec:
  interval: 6h0m0s
  url: https://charts.kasten.io/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k10
  namespace: ${releaseNamespace}
spec:
  chart:
    spec:
      chart: k10
      sourceRef:
        kind: HelmRepository
        name: ${releaseName}-repository
        namespace: ${releaseNamespace}
      version: 9.0.5
  install:
    crds: CreateReplace
    createNamespace: true
    remediation:
      retries: 30
  interval: 15s
  releaseName: k10
  # K10 must be installed into the kasten-io namespace
  targetNamespace: kasten-io
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 30
  valuesFrom:
  - kind: ConfigMap
    name: ${releaseName}-config-defaults
---
