overview: |-
  ## Overview
  Kasten K10 by Veeam is a data management platform purpose-built for Kubernetes. It provides enterprise operations teams with an easy-to-use, scalable and secure system for backup and restore, disaster recovery and application mobility.

  K10 is application-centric: it discovers applications and their dependencies (deployments, configuration and data services) and captures them as a single, consistent unit.

  Source code and documentation can be found here:

  * <https://docs.kasten.io/>
  * <https://charts.kasten.io/>

  ## Namespace
  K10 is always installed into the `kasten-io` namespace, regardless of the workspace namespace this application is deployed from. The namespace is created automatically if it does not already exist.

  ## Post-installation
  Token authentication is enabled by default. Retrieve a token for the K10 dashboard with:

  ```
  kubectl -n kasten-io get secret $(kubectl -n kasten-io get serviceaccount k10-k10 -o jsonpath="{.secrets[0].name}") -o jsonpath="{.data.token}" | base64 -d
  ```
