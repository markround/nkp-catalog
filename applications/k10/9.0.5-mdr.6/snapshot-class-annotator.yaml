---
# One-off job that makes sure K10 has a VolumeSnapshotClass to use for CSI
# snapshots. K10 looks for the k10.kasten.io/is-snapshot-class annotation when
# deciding which VolumeSnapshotClass backs a policy.
#
# - Nutanix: annotates the existing nutanix-snapshot-class.
# - Azure (AKS): if a StorageClass uses the disk.csi.azure.com provisioner,
#   applies azure-volumesnapshotclass.yaml (mounted from a ConfigMap). This is
#   done here rather than by Flux so the class only exists on AKS clusters.
#
# The job is a no-op (exit 0) on clusters where neither applies, or where the
# snapshot CRDs themselves are not present.
#
# TODO - extend this for other providers (EKS, vSphere etc.)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${releaseName}-snapshot-class-annotator
  namespace: kasten-io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ${releaseName}-snapshot-class-annotator
rules:
# VolumeSnapshotClasses are cluster scoped, so this cannot be a namespaced Role
- apiGroups:
  - snapshot.storage.k8s.io
  resources:
  - volumesnapshotclasses
  verbs:
  - get
  - create
  - patch
  - update
- apiGroups:
  - storage.k8s.io
  resources:
  - storageclasses
  verbs:
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ${releaseName}-snapshot-class-annotator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ${releaseName}-snapshot-class-annotator
subjects:
- kind: ServiceAccount
  name: ${releaseName}-snapshot-class-annotator
  namespace: kasten-io
---
apiVersion: batch/v1
kind: Job
metadata:
  # Job specs are immutable, so the app version is part of the name. A catalog
  # upgrade creates a new job and prunes this one rather than failing to apply.
  name: ${releaseName}-snapshot-class-annotator-9-0-5-mdr-6
  namespace: kasten-io
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: ${releaseName}-snapshot-class-annotator
    spec:
      restartPolicy: OnFailure
      serviceAccountName: ${releaseName}-snapshot-class-annotator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: kubectl
        image: docker.io/alpine/kubectl:1.33.4
        command:
        - /bin/sh
        - -c
        - |
          set -eu
          if ! kubectl api-resources --api-group=snapshot.storage.k8s.io -o name \
              | grep -q '^volumesnapshotclasses'; then
            echo "Snapshot CRDs not installed, nothing to do"
            exit 0
          fi

          CLASS=nutanix-snapshot-class
          if kubectl get volumesnapshotclass "$CLASS" >/dev/null 2>&1; then
            kubectl annotate volumesnapshotclass "$CLASS" \
              k10.kasten.io/is-snapshot-class="true" --overwrite
          else
            echo "VolumeSnapshotClass $CLASS not found, skipping"
          fi

          if kubectl get storageclass \
              -o jsonpath='{range .items[*]}{.provisioner}{"\n"}{end}' \
              | grep -qx disk.csi.azure.com; then
            kubectl apply -f /snapshot-classes/azure-volumesnapshotclass.yaml
          else
            echo "No disk.csi.azure.com StorageClass found, skipping Azure"
          fi
        env:
        # kubectl writes its discovery cache under $HOME
        - name: HOME
          value: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: snapshot-classes
          mountPath: /snapshot-classes
          readOnly: true
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
      volumes:
      - name: tmp
        emptyDir: {}
      - name: snapshot-classes
        configMap:
          name: ${releaseName}-snapshot-classes
