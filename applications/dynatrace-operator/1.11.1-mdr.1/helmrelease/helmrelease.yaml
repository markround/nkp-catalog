# Dynatrace's classic Helm repository, rather than the OCI registry at
# oci://public.ecr.aws/dynatrace/dynatrace-operator, as anonymous pulls from
# ECR Public are frequently rate limited (TOOMANYREQUESTS). The chart archives
# are identical, and are downloaded from the operator's GitHub releases.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ${releaseName}-repository
  namespace: ${releaseNamespace}
spec:
  interval: 6h0m0s
  url: https://raw.githubusercontent.com/Dynatrace/dynatrace-operator/main/config/helm/repos/stable
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dynatrace-operator
  namespace: ${releaseNamespace}
spec:
  chart:
    spec:
      chart: dynatrace-operator
      sourceRef:
        kind: HelmRepository
        name: ${releaseName}-repository
        namespace: ${releaseNamespace}
      version: 1.11.1
  install:
    crds: CreateReplace
    createNamespace: true
    remediation:
      retries: 30
  interval: 15s
  releaseName: dynatrace-operator
  # Upstream chart defaults and Dynatrace documentation assume the dynatrace namespace
  targetNamespace: dynatrace
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 30
  valuesFrom:
  - kind: ConfigMap
    name: ${releaseName}-config-defaults
---
