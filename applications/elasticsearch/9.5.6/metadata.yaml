overview: |-
  ## Overview
  Deploys a single-node Elasticsearch 9.5.6 cluster into the workspace namespace for demo purposes, using an `Elasticsearch` custom resource managed by the ECK Operator. It is based on the ECK [quickstart](https://www.elastic.co/docs/deploy-manage/deploy/cloud-on-k8s/elasticsearch-deployment-quickstart).

  The cluster is called `elasticsearch`. It has a single node with a 10Gi persistent volume from the default StorageClass, and is reachable inside the cluster over HTTPS at `https://elasticsearch-es-http.<WORKSPACE NAMESPACE>.svc:9200`. The node needs at least 2GiB of free memory on a worker node to schedule.

  `node.store.allow_mmap` is disabled so that `vm.max_map_count` does not need changing on the nodes. This has performance implications and is not suitable for production workloads.

  This application requires the ECK Operator application to be enabled in the same workspace.

  ## Credentials
  ECK generates a password for the built-in `elastic` superuser. Retrieve it with the following:

  ```
  kubectl -n <WORKSPACE NAMESPACE> get secret elasticsearch-es-elastic-user -o go-template='{{.data.elastic | base64decode}}'
  ```

  ## Connecting
  The HTTP endpoint uses a self-signed certificate generated by ECK. To test connectivity from your workstation:

  ```
  kubectl -n <WORKSPACE NAMESPACE> port-forward svc/elasticsearch-es-http 9200:9200
  curl -k -u "elastic:<PASSWORD>" https://localhost:9200
  ```

  The CA certificate can be retrieved with the following:

  ```
  kubectl -n <WORKSPACE NAMESPACE> get secret elasticsearch-es-http-certs-public -o go-template='{{index .data "ca.crt" | base64decode}}'
  ```

  Source code and documentation can be found here:

  * <https://www.elastic.co/docs/deploy-manage/deploy/cloud-on-k8s>
  * <https://github.com/elastic/cloud-on-k8s>
