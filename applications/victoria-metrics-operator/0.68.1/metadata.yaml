overview: |-
  ## Overview
  The VictoriaMetrics Operator deploys and manages VictoriaMetrics components on Kubernetes. VictoriaMetrics is a fast, cost-effective and scalable time series database and monitoring solution, compatible with Prometheus and its query language.

  The operator adds custom resources for running single-node (`VMSingle`) or clustered (`VMCluster`) VictoriaMetrics, metric collection (`VMAgent`), alerting (`VMAlert`, `VMAlertmanager`) and VictoriaLogs. It can also convert existing Prometheus Operator objects such as `ServiceMonitor`, `PodMonitor` and `PrometheusRule` into their VictoriaMetrics equivalents.

  This application installs only the operator and its CRDs. Create VictoriaMetrics custom resources afterwards to deploy the components you need.

  Source code and documentation can be found here:

  * <https://docs.victoriametrics.com/operator/>
  * <https://github.com/VictoriaMetrics/operator>
  * <https://github.com/VictoriaMetrics/helm-charts/tree/master/charts/victoria-metrics-operator>
