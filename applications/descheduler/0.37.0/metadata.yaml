overview: |-
  ## Overview
  The Kubernetes scheduler only places a pod once, when it is created. As a cluster changes (nodes are added, labels and taints change, workloads come and go) pods can end up on nodes that are no longer the best fit. Descheduler finds those pods and evicts them, so the default scheduler can place their replacements on better nodes. It does not schedule pods itself.

  This application installs Descheduler into the `kube-system` namespace, as in the upstream documentation, using the upstream chart defaults:

  * A `CronJob` that runs every 2 minutes
  * The default policy, which rebalances under-utilised nodes (`LowNodeUtilization`), spreads out duplicate pods (`RemoveDuplicates`), and evicts pods that violate node taints, node affinity, inter-pod anti-affinity or topology spread constraints, or have restarted more than 100 times

  Evictions respect `PodDisruptionBudgets`. By default, pods using `PersistentVolumeClaims`, system-critical pods, DaemonSet pods and pods not managed by a controller (bare pods) are never evicted. Pods using local storage (such as `emptyDir` volumes) can be evicted.

  > **Note:** Descheduler acts on pods in every namespace of the cluster, so only one instance should be enabled per cluster.

  ## Configuration
  To see which pods would be evicted, without evicting anything, run in dry-run mode:

  ```
  cmdOptions:
    v: 3
    dry-run: true
  ```

  The decisions are logged by each run, which can be viewed with:

  ```
  kubectl logs -n kube-system -l app.kubernetes.io/name=descheduler --tail=-1
  ```

  To change how often it runs, set `schedule` (a cron expression). To run it continuously as a `Deployment` instead, set:

  ```
  kind: Deployment
  deschedulingInterval: 5m
  ```

  The policy is set with `deschedulerPolicy`. Note that Helm replaces lists rather than merging them, so overriding `deschedulerPolicy.profiles` replaces the whole default policy.

  Source code and documentation can be found here:

  * <https://github.com/kubernetes-sigs/descheduler>
  * <https://github.com/kubernetes-sigs/descheduler/tree/master/charts/descheduler>
  * <https://github.com/kubernetes-sigs/descheduler#policy-default-evictor-and-strategy-plugins>
