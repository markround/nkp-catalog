apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ${releaseName}-repository
  namespace: ${releaseNamespace}
spec:
  interval: 6h0m0s
  url: https://kubernetes-sigs.github.io/descheduler/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: descheduler
  namespace: ${releaseNamespace}
spec:
  chart:
    spec:
      chart: descheduler
      sourceRef:
        kind: HelmRepository
        name: ${releaseName}-repository
        namespace: ${releaseNamespace}
      version: 0.37.0
  install:
    remediation:
      retries: 30
  interval: 15s
  releaseName: descheduler
  # Descheduler acts on the whole cluster, and the upstream documentation
  # installs it into kube-system
  targetNamespace: kube-system
  upgrade:
    remediation:
      retries: 30
  valuesFrom:
  - kind: ConfigMap
    name: ${releaseName}-config-defaults
---
