overview: |-
  ## Overview
  Whereabouts is an IP address management (IPAM) CNI plugin that assigns IP addresses cluster-wide from a range, without needing a DHCP server. It is typically used with [Multus](https://github.com/k8snetworkplumbingwg/multus-cni) to give pods additional network interfaces (for example macvlan or ipvlan) with addresses from a shared range, while avoiding conflicts between nodes.

  This application installs Whereabouts and its CRDs into the `kube-system` namespace, as assumed by the upstream chart defaults and documentation:

  * A privileged DaemonSet that installs the `whereabouts` CNI binary and configuration onto every node
  * A reconciler that cleans up IP allocations left behind by deleted pods
  * A controller for allocating per-node slices of a range ("fast IPAM")

  ## Usage
  Whereabouts does nothing by itself. Reference it as the `ipam` type in a CNI configuration, for example in a Multus `NetworkAttachmentDefinition`:

  ```
  apiVersion: k8s.cni.cncf.io/v1
  kind: NetworkAttachmentDefinition
  metadata:
    name: macvlan-conf
  spec:
    config: |
      {
        "cniVersion": "0.3.1",
        "name": "macvlan-conf",
        "type": "macvlan",
        "master": "eth0",
        "mode": "bridge",
        "ipam": {
          "type": "whereabouts",
          "range": "192.168.2.225/28"
        }
      }
  ```

  Allocations are stored as `IPPool` resources, which can be inspected with:

  ```
  kubectl get ippools.whereabouts.cni.cncf.io -n kube-system
  ```

  Source code and documentation can be found here:

  * <https://github.com/k8snetworkplumbingwg/whereabouts>
  * <https://github.com/k8snetworkplumbingwg/whereabouts/blob/master/doc/extended-configuration.md>
