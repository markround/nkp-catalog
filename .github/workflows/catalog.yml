name: Catalog Packaging

on:
  push:
    branches:
      - '**'
    tags:
      - '**'

env:
  DISTRIBUTOR_IMAGE: mesosphere/nkp-distributor-linux:v2.18.0
  CATALOG_REGISTRY: ghcr.io/markround/nkp-catalog

jobs:
  validate-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate catalog repository
        run: |
          docker run --rm \
            --entrypoint /opt/nkp/nkp \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            "$DISTRIBUTOR_IMAGE" \
            validate catalog-repository

  # Note the use of /catalog as the volume path, this is because the
  # nkp create catalog commands use the current working directory as
  # a project name.
  create-catalog-bundle:
    runs-on: ubuntu-latest
    needs: validate-catalog
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # github.ref_name is the tag name for tag pushes and the branch name
      # for branch pushes. Slashes are not valid in an OCI tag, so branches
      # like feature/foo become feature-foo.
      - name: Determine collection tag
        run: echo "TAG=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"

      - name: Create catalog bundle
        run: |
          docker run --rm \
            --entrypoint /opt/nkp/nkp \
            -v ${{ github.workspace }}:/catalog \
            -w /catalog \
            "$DISTRIBUTOR_IMAGE" \
            create catalog-bundle --output-file nkp-catalog.tar --collection-tag $TAG

      - name: Upload catalog bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: catalog-bundle
          path: nkp-catalog.tar
          retention-days: 1

  push-catalog-bundle:
    runs-on: ubuntu-latest
    needs: create-catalog-bundle
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download catalog bundle artifact
        uses: actions/download-artifact@v8
        with:
          name: catalog-bundle

      - name: Push catalog bundle
        run: |
          docker run --rm \
            --entrypoint /opt/nkp/nkp \
            -v ${{ github.workspace }}:/catalog \
            -w /catalog \
            "$DISTRIBUTOR_IMAGE" \
            push bundle --bundle nkp-catalog.tar \
              --to-registry "$CATALOG_REGISTRY" \
              --to-registry-username ${{ github.actor }} \
              --to-registry-password ${{ secrets.GITHUB_TOKEN }}